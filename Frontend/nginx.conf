server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The built app is a single page; unknown paths are its routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundles, so a stale copy pins the browser to a stale app:
    # it keeps asking for assets that no longer exist and never learns there was a new build.
    # Revalidating it on every load costs one small request and makes a rebuild take effect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The bundles are content-hashed, so a given name's contents can never change. A new build
    # produces new names, which is what makes caching these for a year safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxying the API through this origin means the browser makes same-origin requests and
    # CORS never enters into it.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
