# Test profile.
#
# The datasource URL is not set here: integration tests start a real PostgreSQL server through
# Zonky's embedded-postgres and inject the URL at runtime (see AbstractPostgresIntegrationTest).
# H2 was considered and rejected — it diverges from PostgreSQL on upserts, sequences and
# numeric handling, which is precisely where this application's storage layer lives.

# The schema is built by the same Flyway migrations the application ships, so tests exercise
# the real schema rather than one Hibernate invented for them.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.level.root=WARN
logging.level.stockmarket=INFO
