spring.application.name=stocks

# Server
server.port=8080
server.servlet.context-path=/api

# Errors are RFC 9457 problem details. The handled ones are shaped that way by
# StockExceptionHandler; this makes the ones Spring rejects before a controller runs — an
# unparseable date, a constraint violation — arrive in the same shape, so a client has one error
# contract to parse rather than two.
spring.mvc.problemdetails.enabled=true

# PostgreSQL. Overridden by SPRING_DATASOURCE_* environment variables in Docker Compose.
spring.datasource.url=jdbc:postgresql://localhost:5432/stock_market
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA. The schema is owned by Flyway, so Hibernate only checks that its mapping agrees with
# what the migrations built; "update" would let entity edits silently reshape a real database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Yahoo Finance retrieval.
# The v8 chart endpoint serves the current price and historical bars in one unauthenticated
# response.
app.yahoo-finance.base-url=https://query1.finance.yahoo.com/v8/finance/chart
app.yahoo-finance.connect-timeout=5s
app.yahoo-finance.read-timeout=10s
app.yahoo-finance.max-retries=3
app.yahoo-finance.retry-delay=500ms
app.yahoo-finance.max-retry-delay=5s
app.yahoo-finance.retry-multiplier=2.0
app.yahoo-finance.default-symbol=AAPL
app.yahoo-finance.default-range=1mo
app.yahoo-finance.default-interval=1d
app.yahoo-finance.user-agent=Mozilla/5.0 (compatible; OaklandStockMarket/1.0)

# Logging
logging.level.root=INFO
logging.level.stockmarket=DEBUG

# CORS. The Vite dev server runs on its own origin; a same-origin deployment can clear this.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
