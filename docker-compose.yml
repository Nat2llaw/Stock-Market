# Repeatable local setup: database, backend and frontend from one command.
#
#   docker compose up --build
#
# Nothing else needs installing — no Java, no Node, no PostgreSQL on the host.
# The application is then at http://localhost:5173 and the API at http://localhost:8080/api.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Exposed so the backend can also be run from an IDE against this database.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The backend fails fast if the database is not ready, so it waits for this rather
      # than for the container merely having been created.
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/stock_market
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
